name: Daily BIM update and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: bim-pages
  cancel-in-progress: false
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public feeds
        id: collect
        continue-on-error: true
        run: python scripts/update_news.py
      - name: Save data and daily archive
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Update BIM news and research feeds'
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir -p public/data
          cp index.html public/index.html
          cp data/news.json public/data/news.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report full source outage
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'All sources failed; historical content and failure status were published.'
          exit 1
